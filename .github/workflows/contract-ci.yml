# Valida que el contrato OpenAPI sea correcto.
name: contract-ci

on:
  pull_request:
    paths:
      - "packages/api-contract/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @redocly/cli@latest lint --config packages/api-contract/redocly.yaml packages/api-contract/openapi.yaml
