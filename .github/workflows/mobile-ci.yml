# CI de la app Flutter. Solo corre si cambia apps/mobile
# y se saltea mientras el proyecto Flutter no exista (sin pubspec.yaml).
name: mobile-ci

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/api-contract/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "apps/mobile/**"

jobs:
  # Detecta si el proyecto ya fue creado (hashFiles no se puede usar en el if de un job).
  detect:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f "apps/mobile/pubspec.yaml" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  analyze-test:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
